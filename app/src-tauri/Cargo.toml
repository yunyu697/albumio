[package]
name = "albumio"
version = "1.0.0-RC1"
description = "Albumio · 目录优先的跨平台图片浏览器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "albumio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/albumio-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
albumio-core = { path = "crates/albumio-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# M9：单实例。第二个进程把启动参数交给已运行的主窗口，然后自行退出。
# 必须第一个注册（插件文档要求），见 `lib.rs` 的 Builder 链。
tauri-plugin-single-instance = "2.5"

# M9：判断当前进程是否以管理员身份运行（管理员进程收不到 Explorer 的 OLE 拖放）；
# 剪贴板读取已复制的文件列表（CF_HDROP）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# dev 下依赖不优化，图像解码慢约 30 倍（1 万项实测：L1 单张 release 22ms / debug 约 700ms），
# `tauri dev` 里的网格会因此看不出真实观感。依赖开 O3，自身代码保持默认以便快速增量编译。
[profile.dev.package."*"]
opt-level = 3

# `"*"` 只覆盖注册表依赖，本工作区的路径依赖要单独点名，否则解码/缩放仍是 O0。
[profile.dev.package.albumio-core]
opt-level = 3
