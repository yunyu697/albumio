[package]
name = "albumio"
version = "0.1.0"
description = "Albumio · 目录优先的跨平台图片浏览器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "albumio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/albumio-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
albumio-core = { path = "crates/albumio-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
