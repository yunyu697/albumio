[package]
name = "albumio-core"
version = "0.1.0"
description = "Albumio 图像管线：探测、解码、方向、色彩、缩略图、缓存"
edition = "2021"
rust-version = "1.87"

[dependencies]
zune-jpeg = "0.5"
jpeg-decoder = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp", "webp", "gif", "jpeg"] }
fast_image_resize = "6"
kamadak-exif = "0.6"
lcms2 = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = "0.37"
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
webp = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# 移入回收站：Windows 走 IFileOperation，Linux 走 Freedesktop Trash。
# （撤销在 Windows 上不走它的 os_limited::list，原因见 src/ops.rs。）
trash = "5"
# 目录监听（M8）：参数与平台差异见 `docs/spike/S6.md`，锁 8.x（9.x 还在 rc）。
notify = "8"

# 撤销要扫 `$Recycle.Bin` 下的 `$I` 记录，需要一次目录遍历就拿到文件名 + 修改时间
# （std 的 read_dir 不给时间，逐条 stat 在 1.7 万条时要 1.4 s）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
# HEIC / AVIF / RAW：系统 WIC（`docs/spike/S2-decoders.md`）。windows-sys 的
# 裸 COM vtable 写起来太容易错，这里用 0.62 的强类型绑定；它已经在依赖图里。
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Imaging"] }

# 磁盘用量：statvfs（只在侧栏的用量块用，不引 sysinfo）。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
