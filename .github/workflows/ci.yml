name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端：类型检查 + 生产构建
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 类型检查 + 生产构建
        run: npm run build
      - name: 调度器单测（P0–P4 顺序、generation 取消）
        run: npm run test:unit

  # 版本规则：自测 + 版本文件一致 + 段位上限
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 版本规则自测（11 段、进位、alpha/RC 不受限、tag 不一致等反例必须被拦）
        run: node scripts/version-rules-test.mjs
      - name: 版本文件一致（package.json / tauri.conf.json / Cargo.toml / MSI 版本）
        run: node scripts/version-sync.mjs --check
      - name: 版本规则校验
        run: node scripts/check-version.mjs
      - name: 图标一形一义校验（同一图形不得承载两个动作）
        run: node scripts/check-icons.mjs

  # Rust：格式、clippy、单元与集成测试（含图像管线）
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 安装 Tauri v2 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev liblcms2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: 格式检查
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --all --check
      - name: Clippy（仅暴露警告，不阻断）
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets
      - name: 单元与集成测试（--workspace：src-tauri 是工作区根，不带就会漏掉 albumio-core）
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --workspace

  # 启动冒烟（Windows 真机）：把 RC5「打开即卡死」的手工验证变成自动门禁。
  # 断言三件事：进程不提前退出、超时内主窗口 Responding=True、缩略图目录有新增产出
  # （证明前端真的跑起来了：列举 → stat → 缩略图整条链路）。失败会按
  # window-unresponsive / pipeline-no-output / exited-early 明确分类。
  # 冒烟目录里刻意放了「共同前缀 + 两段数字」的截图/相机式文件名，正是 RC5 死循环的触发形状。
  smoke-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      - name: 构建（不打包，前端资源内嵌）
        run: npm run tauri build -- --no-bundle
      - name: 启动冒烟：窗口响应 + 缩略图产出
        working-directory: .
        run: pwsh -NoProfile -File scripts/smoke-windows.ps1 -Exe app/src-tauri/target/release/albumio.exe -TimeoutSec 60
