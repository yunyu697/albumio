name: Release（CI 出包，三平台）

# 唯一发布路径：推送 v* 标签即由 CI 构建三平台安装包、生成 latest.json 与 SHA256SUMS 并创建 Release。
# 签名私钥只来自仓库 Secrets（TAURI_SIGNING_PRIVATE_KEY），绝不进仓库。
# Linux 更新只发 AppImage；deb 作为手动下载项。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 版本闸门：tag 必须等于版本文件，minor/patch ≤ 10，预发布序号不受限。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 版本规则自测（反例必须被拦）
        run: node scripts/version-rules-test.mjs
      - name: tag 与版本文件一致 + 段位规则
        run: node scripts/check-version.mjs --tag "$GITHUB_REF_NAME"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
          - os: macos-latest
            platform: macos
            bundles: app,dmg
            # M9：universal2 需要同时装两个 Rust target，产物才能同时跑 Intel 与 Apple Silicon。
            build_args: --target universal-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'macos'
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'macos'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: matrix.platform != 'macos'
        with:
          workspaces: app/src-tauri -> target
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev liblcms2-dev libfuse2 cmake libde265-dev libwebp-dev pkg-config
      - name: 安装 macOS HEIC 构建依赖（内置 libheif）
        if: matrix.platform == 'macos'
        run: brew install cmake libde265 webp pkg-config
      - run: npm ci
        working-directory: app
      - name: 注入版本（package.json → tauri.conf.json / Cargo.toml）
        run: node scripts/version-sync.mjs
      - name: 注入 Apple 签名/公证凭据（缺失则完全不设变量，照样出包）
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 只在有值的键上导出：空字符串的 APPLE_* 会让 bundler 误以为要签名而失败。
          missing=""
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            v="${!k}"
            if [ -n "$v" ]; then
              # 证书是 base64，可能带换行；用 heredoc 形态写入 GITHUB_ENV 才不会被截断。
              delim="EOF_${k}"
              { echo "$k<<$delim"; printf '%s\n' "$v"; echo "$delim"; } >> "$GITHUB_ENV"
            else
              missing="$missing $k"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::缺少 Apple 凭据:$missing。按约定继续产出未签名/未公证包，Gatekeeper 会拦截；补齐 Secrets 后重跑即可。"
          else
            echo "Apple 凭据齐全：tauri build 会签名并提交 notarytool 公证。"
          fi
      - name: 构建安装包与更新包
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # macOS 签名/公证的 APPLE_* 由上一步按“有值才注入”写进 GITHUB_ENV：
          # 没有任何凭据时不设这些变量，bundler 直接产出未签名/未公证包，不把它当阻塞。
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json ${{ matrix.build_args }} --bundles ${{ matrix.bundles }}
      - name: 列出产物（便于排查）
        shell: bash
        run: find app/src-tauri/target -path '*/release/bundle/*' -type f | sort
      - name: 上传本平台产物
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          # universal2 产物在 target/universal-apple-darwin/release 下，用 ** 同时覆盖两种路径。
          path: |
            app/src-tauri/target/**/release/bundle/**/*.msi
            app/src-tauri/target/**/release/bundle/**/*.exe
            app/src-tauri/target/**/release/bundle/**/*.exe.sig
            app/src-tauri/target/**/release/bundle/**/*.dmg
            app/src-tauri/target/**/release/bundle/**/*.tar.gz
            app/src-tauri/target/**/release/bundle/**/*.tar.gz.sig
            app/src-tauri/target/**/release/bundle/**/*.AppImage
            app/src-tauri/target/**/release/bundle/**/*.AppImage.sig
            app/src-tauri/target/**/release/bundle/**/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: 展平产物目录
        run: |
          mkdir -p dist-flat
          find dist-release -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec mv -t dist-flat {} +
          ls -l dist-flat
      - name: 补齐未签名的安装包（更新包由构建时签名，msi/dmg/deb 在此签名）
        # signer sign 直接读取 TAURI_SIGNING_PRIVATE_KEY，不走命令行参数，避免密钥出现在进程参数与日志里。
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          shopt -s nullglob
          for f in dist-flat/*.msi dist-flat/*.exe dist-flat/*.dmg dist-flat/*.deb dist-flat/*.AppImage dist-flat/*.app.tar.gz; do
            [ -f "$f.sig" ] && continue
            echo "signing $f"
            npx --yes @tauri-apps/cli@2 signer sign --app-version "${GITHUB_REF_NAME#v}" "$f"
          done
          # 每个安装包都必须有 .sig，缺失即失败（不做"未签名照发"的降级）。
          for f in dist-flat/*.msi dist-flat/*.exe dist-flat/*.dmg dist-flat/*.deb dist-flat/*.AppImage dist-flat/*.app.tar.gz; do
            test -f "$f.sig" || { echo "缺少签名：$f.sig"; exit 1; }
          done
      - name: 生成 updater 清单 latest.json
        run: node scripts/release-manifest.mjs --flat dist-flat --tag "$GITHUB_REF_NAME"
      - name: 发布前三处一致（tag / 版本文件 / latest.json）
        run: node scripts/check-version.mjs --tag "$GITHUB_REF_NAME" --manifest dist-flat/latest.json
      - name: 生成 SHA256SUMS（文件名按 GitHub 资产名归一，含 .sig）
        run: node scripts/release-checksums.mjs --flat dist-flat --normalize-names dist-flat/SHA256SUMS
      - name: 确认本版本 Release 说明存在
        run: test -f "release-notes/${GITHUB_REF_NAME}.md" || { echo "缺少 release-notes/${GITHUB_REF_NAME}.md"; exit 1; }
      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-RC') }}
          name: Albumio ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            dist-flat/*.msi
            dist-flat/*.exe
            dist-flat/*.dmg
            dist-flat/*.deb
            dist-flat/*.AppImage
            dist-flat/*.app.tar.gz
            dist-flat/*.sig
            dist-flat/latest.json
            dist-flat/SHA256SUMS
          fail_on_unmatched_files: true
