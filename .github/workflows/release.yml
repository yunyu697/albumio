name: Release（CI 出包，三平台）

# 唯一发布路径：推送 v* 标签即由 CI 构建三平台安装包、生成 latest.json 与 SHA256SUMS 并创建 Release。
# 签名私钥只来自仓库 Secrets（TAURI_SIGNING_PRIVATE_KEY），绝不进仓库。
# Linux 更新只发 AppImage；deb 作为手动下载项。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 版本闸门：tag 必须等于版本文件，minor/patch ≤ 10，预发布序号不受限。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 版本规则自测（反例必须被拦）
        run: node scripts/version-rules-test.mjs
      - name: tag 与版本文件一致 + 段位规则
        run: node scripts/check-version.mjs --tag "$GITHUB_REF_NAME"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
          - os: macos-latest
            platform: macos
            bundles: dmg
          - os: ubuntu-22.04
            platform: linux
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: matrix.platform != 'macos'
        with:
          workspaces: app/src-tauri -> target
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev liblcms2-dev libfuse2
      - run: npm ci
        working-directory: app
      - name: 注入版本（package.json → tauri.conf.json / Cargo.toml）
        run: node scripts/version-sync.mjs
      - name: 构建安装包与更新包
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
      - name: 列出产物（便于排查）
        shell: bash
        run: find app/src-tauri/target/release/bundle -maxdepth 2 -type f | sort
      - name: 上传本平台产物
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.tar.gz
            app/src-tauri/target/release/bundle/macos/*.tar.gz.sig
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            app/src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: 展平产物目录
        run: |
          mkdir -p dist-flat
          find dist-release -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec mv -t dist-flat {} +
          ls -l dist-flat
      - name: 补齐未签名的安装包（更新包由构建时签名，msi/dmg/deb 在此签名）
        # signer sign 直接读取 TAURI_SIGNING_PRIVATE_KEY，不走命令行参数，避免密钥出现在进程参数与日志里。
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          shopt -s nullglob
          for f in dist-flat/*.msi dist-flat/*.exe dist-flat/*.dmg dist-flat/*.deb dist-flat/*.AppImage dist-flat/*.app.tar.gz; do
            [ -f "$f.sig" ] && continue
            echo "signing $f"
            npx --yes @tauri-apps/cli@2 signer sign "$f"
          done
          # 每个安装包都必须有 .sig，缺失即失败（不做"未签名照发"的降级）。
          for f in dist-flat/*.msi dist-flat/*.exe dist-flat/*.dmg dist-flat/*.deb dist-flat/*.AppImage dist-flat/*.app.tar.gz; do
            test -f "$f.sig" || { echo "缺少签名：$f.sig"; exit 1; }
          done
      - name: 生成 updater 清单 latest.json
        run: node scripts/release-manifest.mjs --flat dist-flat --tag "$GITHUB_REF_NAME"
      - name: 发布前三处一致（tag / 版本文件 / latest.json）
        run: node scripts/check-version.mjs --tag "$GITHUB_REF_NAME" --manifest dist-flat/latest.json
      - name: 生成 SHA256SUMS（文件名按 GitHub 资产名归一，含 .sig）
        run: node scripts/release-checksums.mjs --flat dist-flat --normalize-names dist-flat/SHA256SUMS
      - name: 确认本版本 Release 说明存在
        run: test -f "release-notes/${GITHUB_REF_NAME}.md" || { echo "缺少 release-notes/${GITHUB_REF_NAME}.md"; exit 1; }
      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-RC') }}
          name: Albumio ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: |
            dist-flat/*.msi
            dist-flat/*.exe
            dist-flat/*.dmg
            dist-flat/*.deb
            dist-flat/*.AppImage
            dist-flat/*.app.tar.gz
            dist-flat/*.sig
            dist-flat/latest.json
            dist-flat/SHA256SUMS
          fail_on_unmatched_files: true
